let type='all', deferredPrompt=null; const q=$('#q'),week=$('#week'),day=$('#day'),period=$('#period'),content=$('#content'),todayInfo=$('#todayInfo'),installBtn=$('#installBtn');
function norm(s){return String(s||'').trim().toLocaleLowerCase('hu')} function includesNorm(a,b){return norm(a).includes(norm(b))}
function isoWeekNumber(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setHours(0,0,0,0);x.setDate(x.getDate()+3-((x.getDay()+6)%7));let w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/86400000-3+((w1.getDay()+6)%7))/7)}
function currentPeriod(d){let mins=d.getHours()*60+d.getMinutes();for(const p of DATA.periods){let [sh,sm]=p.start.split(':').map(Number),[eh,em]=p.end.split(':').map(Number);if(mins>=sh*60+sm&&mins<=eh*60+em)return String(p.n)}return ''}
function todayContext(){let now=new Date(),wn=isoWeekNumber(now),w=wn%2===0?'A':'B',ds=['','Hétfő','Kedd','Szerda','Csütörtök','Péntek',''];return {now,wn,w,dn:ds[now.getDay()]||'',pn:currentPeriod(now)}}
function label(t){return {teacher:'Tanár',class:'Osztály',group:'Csoport',room:'Terem'}[t]}
function related(e,t,name){if(t==='teacher')return e.teachers.includes(name);if(t==='class')return e.classes.includes(name);if(t==='group')return e.groups.includes(name);if(t==='room')return e.rooms.includes(name);return false}
function entryMatches(e){let w=week.value;if(w!=='AB'&&e.week!==w)return false;if(day.value&&e.day!==day.value)return false;if(period.value&&String(e.period)!==period.value)return false;return true}
function details(e,t){let a=[];if(t!=='room'&&e.rooms.length)a.push('<span class="roomtag">'+esc(e.rooms.join(', '))+'</span>');if(t!=='teacher'&&e.teachers.length)a.push('<span class="teachertag">'+esc(e.teachers.join(', '))+'</span>');if(t!=='class'&&e.classes.length)a.push('<span class="classtag">'+esc(e.classes.join(', '))+'</span>');if(t!=='group'&&e.groups.length)a.push('<span class="grouptag">'+esc(e.groups.join(', '))+'</span>');if(e.subject)a.push(esc(e.subject));return a.join(' · ')}
function entityCard(t,name){let es=DATA.entries.filter(e=>related(e,t,name)&&entryMatches(e)).sort((a,b)=>a.dayIndex-b.dayIndex||a.period-b.period);let prev=null;let rows=es.map(e=>{let st=e.day!==prev;prev=e.day;return `<div class="row${st?' day-start':''}"><div class="when">${esc(e.day)}<br>${e.period}. óra<br><span class="muted">${esc(e.time)}</span></div><div class="what">${details(e,t)}</div></div>`}).join('');return `<div class="entity ${t}"><div class="entity-head"><div class="entity-name">${esc(name)}</div><span class="badge">${label(t)} · ${es.length} óra</span></div><div class="schedule">${rows||'<div class="muted">A választott szűrésben nincs elhelyezett óra.</div>'}</div></div>`}
function render(){let term=q.value.trim(),blocks=[];let defs=[['teacher',DATA.teachers],['class',DATA.classes],['group',DATA.groups],['room',DATA.rooms]];let exactTeacher=term?DATA.teachers.find(n=>norm(n)===norm(term)):null;let exactClass=term?DATA.classes.find(n=>norm(n)===norm(term)):null;let exactType=exactTeacher?'teacher':(exactClass?'class':null);let exactName=exactTeacher||exactClass;for(const [t,list] of defs){if(exactType&&t!==exactType)continue;if(!exactType&&type!=='all'&&type!==t)continue;let m=exactType?[exactName]:list.filter(n=>!term||includesNorm(n,term));if(term&&!exactType)m=m.filter(n=>includesNorm(n,term)||DATA.entries.some(e=>related(e,t,n)&&[...e.teachers,...e.classes,...e.groups,...e.rooms,e.subject].some(x=>includesNorm(x,term))));if(m.length)blocks.push(`<div class="section-title">${label(t)}ok (${m.length})</div><div class="results">${m.slice(0,150).map(n=>entityCard(t,n)).join('')}</div>`)}content.innerHTML=blocks.join('')||'<div class="empty">Nincs találat. Próbálj más keresést vagy szűrést.</div>'}
function selectToday(){let c=todayContext();week.value=c.w;day.value=c.dn;period.value='';todayInfo.innerHTML=`${c.wn}. hét → <b>${c.w} hét</b> · ${c.dn||'Hétvége'} · egész nap`;render()}
function selectCurrent(){let c=todayContext();week.value=c.w;day.value=c.dn;period.value=c.pn;todayInfo.innerHTML=`${c.wn}. hét → <b>${c.w} hét</b> · ${c.dn||'Hétvége'}${c.pn?' · '+c.pn+'. óra':' · jelenleg nincs tanóra'}`;render()}
for(const el of [q,week,day,period])el.addEventListener(el===q?'input':'change',render);document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;render()}));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block';});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;installBtn.style.display='none';});
window.addEventListener('appinstalled',()=>{installBtn.style.display='none';deferredPrompt=null;});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
let c=todayContext();week.value=c.w;todayInfo.innerHTML=`${c.wn}. hét → <b>${c.w} hét</b>`;render();
</script></body></html>
