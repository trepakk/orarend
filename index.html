function esc(x){return String(x||'').replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]||ch;});}
function norm(x){return String(x||'').trim().toLocaleLowerCase('hu-HU');}
function contains(a,b){return norm(a).indexOf(norm(b))!==-1;}
function label(t){return {teacher:'Tanár',class:'Osztály',group:'Csoport',room:'Terem'}[t]||'';}
function related(e,t,n){if(t==='teacher')return e.t.indexOf(n)!==-1;if(t==='class')return e.c.indexOf(n)!==-1;if(t==='group')return e.g.indexOf(n)!==-1;if(t==='room')return e.r.indexOf(n)!==-1;return false;}
function isoWeek(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setHours(0,0,0,0);x.setDate(x.getDate()+3-((x.getDay()+6)%7));var w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/86400000-3+((w1.getDay()+6)%7))/7);}
function todayCtx(){var n=new Date(),wn=isoWeek(n),wd=n.getDay(),names=['','Hétfő','Kedd','Szerda','Csütörtök','Péntek',''];return {n:n,wn:wn,w:(wn%2===0?'A':'B'),d:names[wd]||''};}
function currentPeriod(d){var mins=d.getHours()*60+d.getMinutes();for(var i=0;i<DATA.periods.length;i++){var p=DATA.periods[i],a=p.start.split(':'),b=p.end.split(':'),sm=(+a[0])*60+(+a[1]),em=(+b[0])*60+(+b[1]);if(mins>=sm&&mins<=em)return String(p.n);}return '';}
function periodTime(n){for(var i=0;i<DATA.periods.length;i++){if(String(DATA.periods[i].n)===String(n))return DATA.periods[i].start+'–'+DATA.periods[i].end;}return '';}
function matchesFilters(e){if(week.value!=='AB'&&e.w!==week.value)return false;if(day.value&&e.d!==day.value)return false;if(period.value&&String(e.p)!==period.value)return false;return true;}
function details(e,t){var a=[];if(t!=='room'&&e.r.length)a.push('<span class="roomtag">'+esc(e.r.join(', '))+'</span>');if(t!=='teacher'&&e.t.length)a.push('<span class="teachertag">'+esc(e.t.join(', '))+'</span>');if(t!=='class'&&e.c.length)a.push('<span class="classtag">'+esc(e.c.join(', '))+'</span>');if(t!=='group'&&e.g.length)a.push('<span class="grouptag">'+esc(e.g.join(', '))+'</span>');if(e.s)a.push(esc(e.s));return a.join(' · ');}

function render(){var term=q.value.trim(),defs=[['teacher',DATA.teachers],['class',DATA.classes],['group',DATA.groups],['room',DATA.rooms]],blocks=[];var exactT=null,exactC=null;if(term){for(var i=0;i<DATA.teachers.length;i++)if(norm(DATA.teachers[i])===norm(term)){exactT=DATA.teachers[i];break;}for(var j=0;j<DATA.classes.length;j++)if(norm(DATA.classes[j])===norm(term)){exactC=DATA.classes[j];break;}}
for(var d=0;d<defs.length;d++){var tp=defs[d][0],list=defs[d][1];if(exactT&&tp!=='teacher')continue;if(exactC&&!exactT&&tp!=='class')continue;if(!exactT&&!exactC&&type!=='all'&&type!==tp)continue;var m=[];if(exactT&&tp==='teacher')m=[exactT];else if(exactC&&!exactT&&tp==='class')m=[exactC];else{for(var k=0;k<list.length;k++){if(!term||contains(list[k],term))m.push(list[k]);}}
